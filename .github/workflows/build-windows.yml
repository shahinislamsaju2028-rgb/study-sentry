# ============================================================
# অটো Windows EXE বিল্ড (GitHub Actions) — v2
#   এই সংস্করণে বিল্ডের সব আউটপুট + ডায়াগনস্টিক সরাসরি
#   run পেজের "Summary" অংশে দেখা যাবে — লগ খুঁজতে হবে না,
#   আমিও পাবলিক API থেকে পড়তে পারব।
#
#   ডাউনলোড: রিপো → Actions → সর্বশেষ run → Artifacts
# ============================================================

name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch: # চাইলে Actions ট্যাব থেকে ম্যানুয়ালও চালানো যায়

permissions:
  contents: read

jobs:
  build:
    name: NSIS installer (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # বিল্ড + ডায়াগনস্টিক — সবকিছু run পেজের Summary-তে লেখা হবে
      - name: Build Tauri app (NSIS)
        shell: pwsh
        run: |
          $lines = @()
          $lines += "## Build diagnostics"
          $lines += "- node: $(node --version)"
          $lines += "- npm: $(npm --version)"
          try { $lines += "- cargo: $(cargo --version)" } catch { $lines += "- cargo: **MISSING**" }
          try { $lines += "- rustc: $(rustc --version)" } catch { $lines += "- rustc: **MISSING**" }
          $lines += "- tauri.cmd present: $(Test-Path 'node_modules\.bin\tauri.cmd')"
          $lines += ""
          $lines += "### `npm run dist:win` output"
          $lines += '```'
          npm run dist:win 2>&1 | Tee-Object -Variable buildOut
          $code = $LASTEXITCODE
          $lines += $buildOut
          $lines += '```'
          $lines += ""
          $lines += "exit code: **$code**"
          $text = ($lines -join "`n")
          if ($text.Length -gt 80000) { $text = $text.Substring(0, 80000) + "`n...(truncated)..." }
          $text | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          exit $code

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudySentry-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
